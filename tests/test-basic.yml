name: Test basic kernel build inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: arm64
          android-version: ''
          extra-make-args: '[]'
      - name: Assert action ran
        run: |
          echo "Action completed (may have failed due to missing toolchain, which is expected in test environment)"
          echo "PASS: kernel-url input was accepted"
