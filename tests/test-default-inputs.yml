name: Test action with default inputs and invalid kernel URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with minimal required inputs only (expect failure at clone)
        id: action
        uses: .
        continue-on-error: true
        with:
          # Only required inputs provided; all optional inputs use defaults
          kernel-url: 'https://github.com/nonexistent-org-xyz/nonexistent-kernel-repo'
          config: 'defconfig'
          arch: 'arm64'
          anykernel3: 'true'

      - name: Assert action failed at kernel clone step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when kernel-url is invalid, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid kernel-url"

      - name: Verify default kernel-dir was used (no leftover from successful clone)
        run: |
          # The kernel dir should not exist since clone failed
          if [ -d "kernel/kernel" ]; then
            echo "WARN: kernel directory exists unexpectedly"
          fi
          echo "PASS: verified default kernel-dir behavior"
