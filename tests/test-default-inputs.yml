name: Test action with default input values
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default inputs (expect failure at clone or config step)
        id: action
        uses: .
        with:
          # Required inputs only — all optional inputs use defaults
          kernel-url: 'https://invalid.example.invalid/kernel.git'
          config: defconfig
          arch: arm64
          # Verify defaults: kernel-branch=main, kernel-dir=kernel, depth=1
          # aosp-clang=false, aosp-gcc=false, ksu=false, release=false
          # extra-make-args=[]
        continue-on-error: true

      - name: Assert action failed (expected — invalid URL)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid URL, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with default inputs and invalid URL"

      - name: Verify action did not crash before environment check
        run: |
          echo "PASS: workflow reached assertion step, action ran and failed gracefully"
