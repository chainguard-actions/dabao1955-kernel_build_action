name: Test ksu-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/torvalds/linux'
          kernel-branch: 'master'
          kernel-dir: 'kernel'
          arch: arm64
          config: defconfig
          ksu: 'true'
          ksu-other: 'true'
          ksu-url: 'https://github.com/tiann/KernelSU'
          ksu-version: 'main'
      - name: Assert action ran (ksu-url input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ksu-url input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
