name: Test ksu-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/torvalds/linux'
          kernel-branch: 'master'
          kernel-dir: 'kernel'
          depth: '1'
          config: 'defconfig'
          arch: 'arm64'
          ksu: 'true'
          ksu-other: 'true'
          ksu-url: 'https://github.com/tiann/KernelSU'
          ksu-version: 'main'
      - name: Assert action ran (inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with ksu-url input"
