name: Test invalid kernel URL fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid kernel URL (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/this-repo-does-not-exist-xyz/kernel-nonexistent'
          kernel-branch: 'main'
          kernel-dir: 'kernel'
          config: 'defconfig'
          arch: 'arm64'
          anykernel3: 'true'

      - name: Assert action failed due to invalid kernel URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid kernel URL, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid kernel URL"
