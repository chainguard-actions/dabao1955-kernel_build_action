name: Test custom toolchain URL inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/torvalds/linux'
          config: defconfig
          arch: arm64
          other-clang-url: 'https://github.com/llvm/llvm-project'
          other-clang-branch: 'main'
          other-gcc64-url: 'https://github.com/gcc-mirror/gcc'
          other-gcc64-branch: 'master'
          other-gcc32-url: 'https://github.com/gcc-mirror/gcc'
          other-gcc32-branch: 'master'

      - name: Assert action ran with custom toolchain URL inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (cannot build kernel in test environment)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
