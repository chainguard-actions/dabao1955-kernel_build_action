name: Test KSU other without URL fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ksu-other=true but no ksu-url (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: "https://github.com/this-repo-does-not-exist-xyz-abc-123/kernel"
          kernel-branch: "main"
          kernel-dir: "kernel"
          depth: "1"
          config: "defconfig"
          arch: "arm64"
          ksu: "true"
          ksu-other: "true"
          anykernel3: "true"

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when ksu-other=true but ksu-url is empty, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when ksu-other=true but ksu-url not provided"
