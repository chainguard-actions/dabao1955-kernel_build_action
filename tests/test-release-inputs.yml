name: Test release-related URL inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: arm64
          anykernel3: 'true'
          anykernel3-url: https://github.com/osm0sis/AnyKernel3
          bootimg-url: https://example.com/boot.img
          release: 'false'
          access-token: ${{ github.token }}
      - name: Assert action ran (release URL inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with anykernel3-url, bootimg-url, and access-token inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
