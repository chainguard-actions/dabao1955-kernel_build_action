name: Test ksu-other with ksu-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          config: defconfig
          arch: arm64
          ksu: 'true'
          ksu-other: 'true'
          ksu-url: https://github.com/tiann/KernelSU
          anykernel3: 'true'
      - name: Assert action ran (ksu-url input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail during kernel clone or build (expected in test env),
          # but we verify it did NOT fail due to missing ksu-url validation
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at build stage (not due to missing ksu-url)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
