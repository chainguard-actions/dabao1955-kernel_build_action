name: Test basic input parsing and environment check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with minimal required inputs (expect failure at clone)
        id: action
        uses: .
        with:
          kernel-url: 'https://github.com/nonexistent-org-xyz/nonexistent-kernel-repo-xyz.git'
          kernel-branch: main
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: arm64
        continue-on-error: true

      - name: Assert action failed (not at environment check)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (at clone step, not at environment check)
          # because the kernel URL doesn't exist
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with nonexistent kernel repo, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when kernel repo does not exist"
