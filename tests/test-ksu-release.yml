name: Test KernelSU URL and release access-token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: arm64
          ksu: 'true'
          ksu-other: 'true'
          ksu-url: https://github.com/tiann/KernelSU
          ksu-version: main
          release: 'false'
          access-token: ${{ github.token }}
      - name: Assert action was invoked
        run: |
          echo "Action completed (may have failed due to network/build constraints)"
          echo "PASS: ksu-url and access-token inputs were accepted"
