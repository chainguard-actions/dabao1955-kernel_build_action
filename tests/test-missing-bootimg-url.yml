name: Test missing bootimg-url fails when anykernel3 is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without bootimg-url when anykernel3 is false (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/this-repo-does-not-exist-xyz/kernel-nonexistent'
          kernel-branch: 'main'
          kernel-dir: 'kernel'
          config: 'defconfig'
          arch: 'arm64'
          anykernel3: 'false'
          # bootimg-url intentionally omitted

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when bootimg-url is missing and anykernel3 is false, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when bootimg-url is missing"
