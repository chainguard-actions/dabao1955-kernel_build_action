name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts and parses optional boolean inputs without crashing.
      # The action will fail at the kernel clone/build step, but input parsing
      # happens before that and should succeed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/torvalds/linux'
          kernel-branch: 'master'
          kernel-dir: 'kernel'
          depth: '1'
          config: 'defconfig'
          arch: 'arm64'
          ksu: 'false'
          ksu-version: 'main'
          ksu-lkm: 'false'
          anykernel3: 'false'
          disable-lto: 'false'
          ccache: 'false'
          lxc: 'false'
          kvm: 'false'
          nethunter: 'false'
          rekernel: 'false'
          bbg: 'false'
          vendor: 'false'
          extra-make-args: '[]'

      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with optional inputs (outcome=$OUTCOME)"
