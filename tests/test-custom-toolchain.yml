name: Test custom toolchain URL inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          kernel-dir: kernel
          config: defconfig
          arch: arm64
          other-clang-url: https://github.com/llvm/llvm-project
          other-clang-branch: main
          other-gcc64-url: https://github.com/torvalds/linux
          other-gcc64-branch: master
          other-gcc32-url: https://github.com/torvalds/linux
          other-gcc32-branch: master
        continue-on-error: true
      - name: Assert action ran with custom toolchain URL inputs
        run: |
          echo "Action completed (other-clang-url, other-gcc64-url, other-gcc32-url inputs were accepted)"
          echo "PASS"
