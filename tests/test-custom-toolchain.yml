name: Test custom Clang and GCC toolchain URLs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal kernel source directory
        run: |
          mkdir -p /tmp/kernel-src
          cat > /tmp/kernel-src/Makefile << 'EOF'
          VERSION = 5
          PATCHLEVEL = 15
          SUBLEVEL = 0
          EOF
          echo "Kernel source directory created"
      - id: action
        uses: .
        with:
          kernel-url: /tmp/kernel-src
          kernel-dir: kernel
          config: defconfig
          arch: arm64
          depth: '1'
          other-clang-url: https://github.com/llvm/llvm-project
          other-clang-branch: main
          other-gcc64-url: https://github.com/gcc-mirror/gcc
          other-gcc64-branch: master
          other-gcc32-url: https://github.com/gcc-mirror/gcc
          other-gcc32-branch: master
        continue-on-error: true
      - name: Assert action ran with custom toolchain URLs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom toolchain URLs (outcome: ${{ steps.action.outcome }})"
