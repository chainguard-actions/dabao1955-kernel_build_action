name: Test environment check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Linux environment prerequisites
        run: |
          echo "Checking platform..."
          uname -s
          if [ "$(uname -s)" != "Linux" ]; then
            echo "FAIL: not running on Linux"
            exit 1
          fi
          echo "PASS: running on Linux"

          echo "Checking apt availability..."
          if ! command -v apt-get &>/dev/null; then
            echo "FAIL: apt-get not found"
            exit 1
          fi
          echo "PASS: apt-get is available"

          echo "Checking GITHUB_ACTIONS env var..."
          if [ "$GITHUB_ACTIONS" != "true" ]; then
            echo "FAIL: GITHUB_ACTIONS is not 'true', got: $GITHUB_ACTIONS"
            exit 1
          fi
          echo "PASS: GITHUB_ACTIONS=true"

      # Run the action with continue-on-error; it will fail at kernel clone
      # but should NOT fail at the environment check step
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/torvalds/linux'
          kernel-branch: 'master'
          kernel-dir: 'kernel'
          depth: '1'
          config: 'defconfig'
          arch: 'arm64'

      - name: Assert action did not fail due to environment check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail at kernel clone/build, not at environment check.
          # If it fails at environment check, the error message would be about
          # "GitHub Actions Linux runners". We can't distinguish here, but we
          # verify the action ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) - environment check passed"
