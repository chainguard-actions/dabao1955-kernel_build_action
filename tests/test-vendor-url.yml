name: Test vendor-url and access-token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/torvalds/linux'
          kernel-branch: 'master'
          kernel-dir: 'kernel'
          depth: '1'
          config: 'defconfig'
          arch: 'arm64'
          vendor: 'true'
          vendor-url: 'https://github.com/torvalds/linux'
          vendor-branch: 'master'
          vendor-dir: 'vendor'
          access-token: ${{ github.token }}
      - name: Assert action ran (inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail due to network/build constraints in CI,
          # but we verify the inputs were accepted (not rejected as unknown)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with vendor-url and access-token inputs"
