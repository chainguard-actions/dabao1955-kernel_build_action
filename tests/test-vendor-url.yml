name: Test vendor-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          config: defconfig
          arch: arm64
          vendor: 'true'
          vendor-url: https://github.com/torvalds/linux
          vendor-branch: master
          vendor-dir: vendor_kernel
          anykernel3: 'true'
      - name: Assert action ran with vendor-url input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail during kernel clone or build (takes too long),
          # but the important thing is that vendor-url input was accepted and processed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with vendor-url input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
