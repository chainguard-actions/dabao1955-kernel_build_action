name: Test vendor URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          kernel-dir: kernel
          config: defconfig
          arch: arm64
          vendor: 'true'
          vendor-url: https://github.com/torvalds/linux
          vendor-branch: master
          vendor-dir: vendor
        continue-on-error: true
      - name: Assert action ran with vendor-url input
        run: |
          echo "Action completed (vendor-url input was accepted)"
          echo "PASS"
