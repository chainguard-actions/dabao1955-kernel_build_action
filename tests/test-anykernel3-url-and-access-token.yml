name: Test anykernel3-url and access-token input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          config: defconfig
          arch: arm64
          anykernel3: 'true'
          anykernel3-url: https://github.com/osm0sis/AnyKernel3
          release: 'true'
          access-token: ${{ github.token }}
      - name: Assert action ran (anykernel3-url and access-token inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail during kernel clone/build (expected in test env),
          # but we verify the inputs were accepted without early validation errors
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at build stage (anykernel3-url and access-token inputs were accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
