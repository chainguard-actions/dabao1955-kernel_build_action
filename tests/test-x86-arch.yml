name: Test x86_64 architecture input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with x86_64 arch (expect failure at clone)
        id: action
        uses: .
        with:
          kernel-url: 'https://github.com/nonexistent-org-xyz/nonexistent-kernel-repo-xyz.git'
          kernel-branch: main
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: x86_64
        continue-on-error: true

      - name: Assert action failed at clone (not at arch input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the clone step (not at arch input parsing)
          # This verifies that x86_64 arch input is accepted
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with nonexistent kernel repo, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted x86_64 arch and failed at clone step"
