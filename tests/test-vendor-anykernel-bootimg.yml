name: Test vendor, anykernel3, and bootimg URL inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: arm64
          vendor: 'true'
          vendor-url: https://github.com/torvalds/linux
          vendor-branch: master
          vendor-dir: vendor
          anykernel3: 'true'
          anykernel3-url: https://github.com/osm0sis/AnyKernel3
          bootimg-url: https://example.com/boot.img
      - name: Assert action was invoked
        run: |
          echo "Action completed (may have failed due to network/build constraints)"
          echo "PASS: inputs were accepted"
