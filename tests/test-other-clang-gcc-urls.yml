name: Test other-clang-url, other-gcc64-url, other-gcc32-url input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          config: defconfig
          arch: arm64
          other-clang-url: https://github.com/llvm/llvm-project
          other-clang-branch: main
          other-gcc64-url: https://github.com/llvm/llvm-project
          other-gcc64-branch: main
          other-gcc32-url: https://github.com/llvm/llvm-project
          other-gcc32-branch: main
          anykernel3: 'true'
      - name: Assert action ran (other-clang-url, other-gcc64-url, other-gcc32-url inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail during toolchain download or kernel build (expected in test env),
          # but we verify the inputs were accepted without early validation errors
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at toolchain/build stage (inputs were accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
