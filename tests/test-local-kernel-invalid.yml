name: Test local kernel path - invalid source
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a non-kernel directory (missing Makefile/Kconfig/arch)
        run: |
          mkdir -p /tmp/not-a-kernel
          echo "just a random file" > /tmp/not-a-kernel/README.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: /tmp/not-a-kernel/
          arch: arm64

      - name: Assert action failed gracefully on invalid kernel source
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid kernel source directory"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed on a non-kernel directory"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
