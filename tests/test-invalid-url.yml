name: Test invalid kernel URL fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid kernel URL (expect failure)
        id: action
        uses: .
        with:
          kernel-url: 'https://invalid.example.invalid/nonexistent/kernel.git'
          kernel-branch: main
          config: defconfig
          arch: arm64
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid URL, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid kernel URL"
