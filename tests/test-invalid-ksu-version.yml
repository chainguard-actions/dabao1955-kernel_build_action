name: Test invalid ksu-version (special character rejection)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          arch: arm64
          ksu: 'true'
          ksu-version: 'main; rm -rf /'

      - name: Assert action failed with invalid ksu-version error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected ksu-version with special characters"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected ksu-version with special characters"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
