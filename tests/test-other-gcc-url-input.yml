name: Test other-gcc64-url and other-gcc32-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: arm64
          other-gcc64-url: https://github.com/gcc-mirror/gcc
          other-gcc64-branch: master
          other-gcc32-url: https://github.com/gcc-mirror/gcc
          other-gcc32-branch: master
      - name: Assert action ran (other-gcc64-url and other-gcc32-url inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with other-gcc64-url and other-gcc32-url inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
