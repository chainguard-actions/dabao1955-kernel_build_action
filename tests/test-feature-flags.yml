name: Test feature flag inputs (ksu, lxc, kvm, etc.)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with feature flags enabled (expect failure at clone)
        id: action
        uses: .
        with:
          kernel-url: 'https://github.com/nonexistent-org-xyz/nonexistent-kernel-repo-xyz.git'
          kernel-branch: main
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: arm64
          ksu: 'false'
          ksu-lkm: 'false'
          ksu-other: 'false'
          rekernel: 'false'
          nethunter: 'false'
          nethunter-patch: 'false'
          lxc: 'false'
          lxc-patch: 'false'
          kvm: 'false'
          bbg: 'false'
          disable-lto: 'false'
          ccache: 'false'
          anykernel3: 'false'
          release: 'false'
          extra-make-args: '[]'
        continue-on-error: true

      - name: Assert action failed at clone (not at feature flag parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the clone step (not at boolean input parsing)
          # This verifies that all feature flag inputs are parsed correctly
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with nonexistent kernel repo, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly parsed all feature flags and failed at clone step"
