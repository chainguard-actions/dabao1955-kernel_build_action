name: Test KernelSU inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          config: defconfig
          arch: arm64
          ksu: 'true'
          ksu-version: main
          ksu-lkm: 'false'
          ksu-other: 'true'
          ksu-url: https://github.com/tiann/KernelSU
          release: 'false'
          extra-make-args: '[]'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with ksu-url input"
          echo "PASS"
