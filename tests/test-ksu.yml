name: Test KernelSU integration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/torvalds/linux'
          kernel-branch: 'master'
          kernel-dir: 'kernel'
          depth: '1'
          arch: 'arm64'
          config: 'defconfig'
          ksu: 'true'
          ksu-version: 'main'

      - name: Assert action ran with KernelSU inputs (build or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with KernelSU enabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test environment without full toolchain)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
