name: Test KernelSU inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: master
          config: defconfig
          arch: arm64
          ksu: 'true'
          ksu-version: main
          ksu-lkm: 'false'
          ksu-other: 'true'
          ksu-url: https://github.com/tiann/KernelSU
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to environment constraints)"
          echo "PASS: ksu-url input was accepted"
