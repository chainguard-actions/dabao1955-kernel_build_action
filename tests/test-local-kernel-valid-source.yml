name: Test local kernel path - valid kernel source structure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The fake-kernel fixture has Makefile (with VERSION =), Kconfig, and arch/arm64/configs/defconfig
      # This satisfies isKernelSource() validation. The action will proceed past source validation
      # and fail later at the build step (no real kernel to compile), which is expected.
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: ${{ github.workspace }}/tests/fixtures/fake-kernel/
          arch: arm64
          config: defconfig

      - name: Assert action ran and failed gracefully (build step, not validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the build step (fake kernel can't compile),
          # NOT at the source validation step. Either way, failure is expected here
          # since we have no real kernel source to build.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected - fake kernel cannot be compiled)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (unlikely but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
