name: Test other-clang-url, other-gcc64-url, and other-gcc32-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: 'https://github.com/torvalds/linux'
          kernel-branch: 'master'
          kernel-dir: 'kernel'
          depth: '1'
          config: 'defconfig'
          arch: 'arm64'
          other-clang-url: 'https://github.com/llvm/llvm-project'
          other-clang-branch: 'main'
          other-gcc64-url: 'https://github.com/gcc-mirror/gcc'
          other-gcc64-branch: 'master'
          other-gcc32-url: 'https://github.com/gcc-mirror/gcc'
          other-gcc32-branch: 'master'
      - name: Assert action ran (inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with other-clang-url, other-gcc64-url, and other-gcc32-url inputs"
