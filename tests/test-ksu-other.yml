name: Test KernelSU with third-party fork
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        continue-on-error: true
        uses: .
        with:
          kernel-url: https://github.com/torvalds/linux
          kernel-branch: v6.1
          kernel-dir: kernel
          depth: '1'
          config: defconfig
          arch: arm64
          ksu: 'true'
          ksu-other: 'true'
          ksu-url: https://github.com/tiann/KernelSU
          ksu-version: main
          anykernel3: 'true'
          release: 'false'
          extra-make-args: '[]'
      - name: Assert action was invoked
        run: |
          echo "Action completed (may have failed due to environment constraints)"
          echo "PASS: inputs were accepted"
