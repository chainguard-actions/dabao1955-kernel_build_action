name: Test missing kernel config fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-kernel repo (expect config not found failure)
        id: action
        uses: .
        with:
          # Use a tiny public repo that will clone fast but has no kernel config
          kernel-url: 'https://github.com/actions/hello-world-javascript-action.git'
          kernel-branch: main
          config: defconfig
          arch: arm64
        continue-on-error: true

      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing config, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when kernel config was not found"
