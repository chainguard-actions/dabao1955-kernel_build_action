name: Test missing config file error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          kernel-url: ${{ github.workspace }}/pristine/dabao1955--kernel_build_action/v1.10.0/tests/fixtures/kernel-source/
          config: nonexistent_defconfig
          arch: arm64

      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing config, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for missing config file"
