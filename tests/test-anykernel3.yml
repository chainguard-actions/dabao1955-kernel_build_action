name: Test AnyKernel3 packaging option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal kernel source directory
        run: |
          mkdir -p /tmp/kernel-src
          cat > /tmp/kernel-src/Makefile << 'EOF'
          VERSION = 5
          PATCHLEVEL = 15
          SUBLEVEL = 0
          EOF
          echo "Kernel source directory created"
      - id: action
        uses: .
        with:
          kernel-url: /tmp/kernel-src
          kernel-dir: kernel
          config: defconfig
          arch: arm64
          depth: '1'
          anykernel3: 'true'
        continue-on-error: true
      - name: Assert action ran with AnyKernel3 enabled
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with AnyKernel3 enabled (outcome: ${{ steps.action.outcome }})"
